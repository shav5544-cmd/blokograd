<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Rubik,system-ui,sans-serif;color:#fff;min-height:100vh;background-color:#1f2333;
 background-image:linear-gradient(#ffffff07 2px,transparent 2px),linear-gradient(90deg,#ffffff07 2px,transparent 2px);background-size:32px 32px;user-select:none}
#app{max-width:920px;margin:0 auto;padding:12px 12px 40px}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.btn{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.4;padding:14px 16px;border:4px solid #11131b;background:#4caf50;color:#fff;cursor:pointer;
 box-shadow:inset -4px -4px 0 rgba(0,0,0,.32),inset 4px 4px 0 rgba(255,255,255,.28);text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);filter:brightness(.95)}
.btn.blue{background:#2f8de4}.btn.orange{background:#f08a24}.btn.purple{background:#8a5cd6}.btn.grey{background:#6b7085}.btn.red{background:#d84343}.btn.gold{background:#e0a91c}
.btn:disabled{background:#4a4e5e;cursor:not-allowed;filter:none}
.panel{background:#2b3044;border:4px solid #11131b;box-shadow:inset -4px -4px 0 #21253a,inset 4px 4px 0 #3c4263;padding:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .who{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.chip{font-family:'Press Start 2P',monospace;font-size:11px;background:#151824;border:3px solid #0c0e15;padding:9px 10px;white-space:nowrap}
.chip.c{color:#7ff3ff}.chip.f{color:#ffb547}
.iconbtn{font-size:18px;background:#151824;border:3px solid #0c0e15;color:#fff;padding:5px 9px;cursor:pointer}
.logo{text-align:center;margin:6px 0 16px}
.logo h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,5vw,34px);margin:0;color:#7ed957;text-shadow:4px 4px 0 #2e5a1d,8px 8px 0 #11131b}
.logo p{margin:12px 0 0;color:#c7cbe0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.isl{border:4px solid #11131b;cursor:pointer;position:relative;background:#2b3044;transition:transform .12s}
.isl:hover{transform:translateY(-3px)}
.isl .sky{height:120px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;position:relative}
.isl .gr{height:14px;border-top:6px solid}
.isl .info{padding:10px;text-align:center}
.isl .nm{font-weight:900;font-size:16px}
.isl .tb{font-family:'Press Start 2P',monospace;font-size:13px;color:#ffd23f;margin:8px 0 6px}
.isl .st{font-size:20px;letter-spacing:2px;color:#ffd23f}
.isl.locked{cursor:default;filter:grayscale(1) brightness(.55)}
.isl.locked:hover{transform:none}
.isl .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.isl.boss{grid-column:1/-1}
.isl.boss .sky{height:150px}
.isl .badge{position:absolute;top:8px;left:8px;font-family:'Press Start 2P',monospace;font-size:10px;background:#11131bcc;padding:6px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.menu .btn{font-size:12px;padding:18px 10px}
.sub{font-size:9px;opacity:.85;display:block;margin-top:8px}
/* battle */
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bhead .t{flex:1;font-weight:900;font-size:18px}
.hearts{font-size:22px;letter-spacing:2px}
.scene{position:relative;height:230px;border:4px solid #11131b;overflow:hidden}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:46px;border-top:10px solid}
.actor{position:absolute;bottom:42px;transition:transform .15s}
.hero{left:16%}.mob{right:16%}
.hpbar{position:absolute;top:10px;right:10px;left:50%;height:22px;background:#11131b;border:3px solid #11131b}
.hpbar i{display:block;height:100%;background:linear-gradient(#ff6b6b,#d63031);transition:width .3s}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:9px}
.prog{position:absolute;top:10px;left:10px;font-family:'Press Start 2P',monospace;font-size:10px;background:#11131bcc;padding:6px 8px}
.combo{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:14px;color:#ffd23f;text-shadow:3px 3px 0 #000;white-space:nowrap}
.float{position:absolute;font-family:'Press Start 2P',monospace;font-size:20px;text-shadow:3px 3px 0 #000;pointer-events:none;animation:fl 0.9s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.atk{transform:translateX(70px) rotate(8deg)}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(14px);filter:brightness(3)}50%{transform:translateX(-8px)}75%{transform:translateX(6px);filter:brightness(2)}}
.hurt{animation:hurt .4s}
@keyframes hurt{0%,100%{transform:translateX(0);filter:none}30%{transform:translateX(-14px);filter:sepia(1) saturate(6) hue-rotate(-40deg)}60%{transform:translateX(8px)}}
.die{animation:die .7s forwards}
@keyframes die{to{transform:translateY(30px) scale(.2) rotate(40deg);opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,0)}}
.qbox{margin-top:10px;text-align:center;position:relative;min-height:118px}
.q{font-family:'Press Start 2P',monospace;font-size:clamp(26px,7vw,46px);padding:8px 0;text-shadow:4px 4px 0 #000}
.q .ans{display:inline-block;min-width:2.2em;border-bottom:6px solid #ffd23f;color:#ffd23f}
.fb{min-height:24px;font-weight:900;font-size:18px}
.fb.ok{color:#7ed957}.fb.bad{color:#ff7272}
.hint{position:absolute;top:0;left:0;right:0;min-height:100%;background:#3a2330;border:4px solid #11131b;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:3}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:10px auto 0}
.pad .btn{font-size:22px;padding:16px 0;background:#6b7085}
.pad .btn.ok{background:#4caf50}.pad .btn.del{background:#d84343}
.gwrap{border:4px solid #11131b;background:#000;line-height:0}
.gwrap canvas{width:100%;height:auto;image-rendering:pixelated}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:10px}
.ctrl[hidden],.quiz[hidden]{display:none}
.ctrl .mv{font-size:24px;padding:18px 26px;background:#6b7085;touch-action:none}
.ctrl .jump{background:#2f8de4;padding:18px 34px}
.khint{flex:1;color:#c7cbe0;font-size:13px;text-align:center;line-height:1.5}
.quiz{margin-top:10px;position:relative;text-align:center;min-height:200px}
.quiz .lbl{font-weight:900;font-size:17px;color:#ffb547}
.quiz .q{font-size:clamp(24px,6vw,40px)}
.pad2{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:600px;margin:8px auto 0}
.pad2 .btn{font-size:18px;padding:13px 0;background:#6b7085}
.pad2 .btn.ok{background:#4caf50}.pad2 .btn.del{background:#d84343}
@media(max-width:640px){.ctrl .mv{padding:22px 24px;font-size:26px}.ctrl .jump{padding:22px 34px}.khint{visibility:hidden}}
.g3{position:relative;height:calc(100vh - 92px);min-height:420px;border:4px solid #11131b;overflow:hidden;touch-action:none;background:#000;user-select:none}
.g3 canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:60%}
.hud>div{background:#000a;padding:7px 9px;font-family:'Press Start 2P',monospace;font-size:11px;border:2px solid #0008}
.cmp{position:absolute;top:8px;right:8px;text-align:center;pointer-events:none;background:#000a;padding:6px 10px;border:2px solid #0008;min-width:96px}
.cmp .arr{font-size:26px;color:#ffd23f;display:inline-block;text-shadow:2px 2px 0 #000}
#cmpt{font-family:'Press Start 2P',monospace;font-size:8px;margin-top:4px;white-space:nowrap}
.combo3{position:absolute;top:60px;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:18px;color:#ffd23f;text-shadow:3px 3px 0 #000;pointer-events:none}
.msg3{position:absolute;top:34%;left:50%;transform:translateX(-50%);background:#000c;padding:12px 16px;font-weight:900;font-size:18px;display:none;pointer-events:none;text-align:center}
.banner3{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000c;border:4px solid #11131b;padding:18px;text-align:center;width:min(560px,92%);pointer-events:none;display:flex;flex-direction:column;gap:10px}
.banner3 b{font-family:'Press Start 2P',monospace;font-size:18px;color:#ffd23f}.banner3 span{font-size:17px;font-weight:700}.banner3 small{color:#c7cbe0;font-size:14px;line-height:1.4}
.joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff66;display:none;pointer-events:none}
.joy i{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
.jbtn{position:absolute;right:20px;bottom:22px;font-size:26px!important;padding:22px 28px!important;background:#2f8de4cc!important;display:none}
.g3.touch .joy,.g3.touch .jbtn{display:block}
.g3.quizon .joy,.g3.quizon .jbtn{display:none}
.quiz3{position:absolute;left:0;right:0;bottom:0;background:#1f2333f0;border-top:4px solid #11131b;padding:10px;text-align:center}
.quiz3[hidden]{display:none}
.quiz3 .lbl{font-weight:900;font-size:17px;color:#ffb547}.quiz3 .q{font-size:clamp(24px,6vw,40px);padding:4px 0}
.g3.shake{animation:shk .35s}
/* mine */
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:0;border:4px solid #11131b;background:#3a2a1e;max-width:520px;margin:0 auto}
.blk{aspect-ratio:1;position:relative;background:#7d7d85;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.18)}
.blk.dirt{background:#8a5a2b}
.blk.broken{background:#2a1e15;box-shadow:inset 0 0 0 2px #1d140e}
.blk .o{position:absolute;inset:22%;}
.blk.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25);filter:brightness(2)}100%{transform:scale(1)}}
.timer{font-family:'Press Start 2P',monospace;font-size:22px}
/* modal */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{max-width:460px;width:100%;text-align:center}
.modal h2{font-family:'Press Start 2P',monospace;font-size:18px;line-height:1.5;margin:6px 0 12px;color:#ffd23f}
.modal p{font-size:17px;line-height:1.4;margin:8px 0}
.modal .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bigstars{font-size:46px;color:#ffd23f;letter-spacing:6px;text-shadow:3px 3px 0 #000}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:#2b3044;border:4px solid #11131b;padding:12px 16px;font-weight:900;font-size:16px;box-shadow:0 6px 0 #0008;animation:tin .3s;max-width:90vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
input.name{font-family:'Press Start 2P',monospace;font-size:16px;padding:14px;width:100%;border:4px solid #11131b;background:#151824;color:#fff;text-align:center;outline:none}
/* knowledge map */
.km{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:560px;margin:0 auto}
.km div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2.3vw,14px);font-weight:700;border:2px solid #11131b}
.km .h{background:#151824;color:#ffd23f;font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.8vw,11px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:16px;border:2px solid #11131b;display:inline-block}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{text-align:center;padding:10px;cursor:pointer}
.item .pv{height:150px;display:flex;align-items:center;justify-content:center;background:#1b1e2b;border:3px solid #11131b;margin-bottom:8px}
.item.on{outline:4px solid #ffd23f}
.ach{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:8px}
.ach .ic{font-size:30px;width:44px;text-align:center}
.ach.no{opacity:.45;filter:grayscale(1)}
.ach b{display:block;font-size:16px}.ach small{color:#c7cbe0;font-size:14px}
h2.sec{font-family:'Press Start 2P',monospace;font-size:16px;color:#ffd23f;margin:4px 0 14px;line-height:1.5}
.note{color:#c7cbe0;font-size:15px;line-height:1.4;text-align:center}
@media(max-width:520px){.scene{height:200px}.actor canvas{transform:scale(.85);transform-origin:bottom center}.pad .btn{padding:13px 0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== СОХРАНЕНИЕ ===================== */
const SAVE_KEY='blokograd_v1';
function defaults(){return{name:'',crystals:0,stars:{},unlocked:1,facts:{},skin:{shirt:'#2f8de4',hat:'none'},owned:['shirt:#2f8de4','hat:none'],mineBest:0,streak:0,lastDay:'',ach:{},bestCombo:0,sound:true,wins:0}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(r)return Object.assign(defaults(),JSON.parse(r))}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ===================== ЗВУК ===================== */
let AC=null;
function beep(f,d=.1,type='square',v=.05,delay=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SFX={ok(){beep(660,.08);beep(990,.12,'square',.05,.08)},bad(){beep(180,.3,'sawtooth',.05)},win(){[523,659,784,1046,1318].forEach((f,i)=>beep(f,.16,'square',.05,i*.12))},click(){beep(500,.03,'square',.025)},coin(){beep(1200,.05,'square',.035);beep(1700,.08,'square',.035,.05)},combo(){[784,988,1175].forEach((f,i)=>beep(f,.07,'square',.04,i*.05))},lose(){[392,330,262,196].forEach((f,i)=>beep(f,.2,'triangle',.06,i*.16))}};

/* ===================== СПРАЙТЫ ===================== */
const SPR={
slime:{p:{G:'#5cc94a',L:'#a6ef94',K:'#1d3b17'},r:["..........","..GGGGGG..",".GLLGGGGG.","GLGGGGGGGG","GGKKGGKKGG","GGKKGGKKGG","GGGGGGGGGG","GGGGKKGGGG",".GGGGGGGG.",".........."]},
mushroom:{p:{R:'#d83a3a',W:'#ffffff',S:'#f1dfb8',K:'#222'},r:["...RRRR...",".RRWRRWRR.","RRRRRRRRRR","RWRRRRRWRR","RRRRRRRRRR","..SSSSSS..","..SKSSKS..","..SSSSSS..","..SSKKSS..","..SSSSSS.."]},
cactus:{p:{G:'#3f9a3a',K:'#111',Y:'#c99a45',P:'#ff7ab8'},r:["....PP....","...GGGG...","G..GKGK..G","G..GGGG..G","GGGGGGGGGG","...GKKG...","...GGGG...","...GGGG...","...GGGG...","..YYYYYY.."]},
snow:{p:{B:'#333',W:'#f4f8ff',K:'#222',O:'#f08a24',S:'#7a4d22'},r:["...BBBB...","...BBBB...","..WWWWWW..","..WKWWKW..","..WWOOWW..","..WKKKKW..",".WWWWWWWW.","SWWWKWWWWS",".WWWKWWWW.","..WWWWWW.."]},
snake:{p:{G:'#2fae4f',K:'#111',R:'#ff3b3b',D:'#1d7a35'},r:["......GGG.",".....GKGKG",".....GGGGG",".....GRRG.","....GG....","...DG.....","..GD......",".GGDGDGG..","GD.....GG.",".GGDGDGG.."]},
eye:{p:{P:'#6b4bb3',W:'#eeeeee',B:'#2aa7d8',K:'#111'},r:["..PPPPPP..",".PPPPPPPP.","PPWWWWWWPP","PWWWBBWWWP","PWWBKKBWWP","PWWBKKBWWP","PWWWBBWWWP","PPWWWWWWPP",".PPPPPPPP.","..P.PP.P.."]},
lava:{p:{O:'#ff8c1a',R:'#d8331f',Y:'#ffe14d',K:'#2a0a00'},r:["OOOOOOOOOO","OYRRORRYOO","ORRRRRRRRO","OKKRRRRKKO","OKYRRRRKYO","ORRRRRRRRO","ORKKKKKKRO","ORRRYRRRRO","OOOOOOOOOO",".O.O..O.O."]},
dragon:{p:{C:'#7fd3ff',W:'#ffffff',K:'#123',R:'#ff5a7a',Y:'#f6c445'},r:["....CC....","...CCCC...","..CKCCKC..","..CCCCCC..","WWCCRRCCWW","WWWCCCCWWW",".WWCCCCWW.","...CCCC...","..CC..CC..","..YY..YY.."]},
golem:{p:{S:'#5d6270',D:'#3a3d46',R:'#ff3355',K:'#1a1a1a',M:'#8a2be2'},r:["..SSSSSS..",".SSSSSSSS.",".SRRSSRRS.",".SSSSSSSS.",".SSKKKKSS.","SSSSMMSSSS","SDSSSSSSDS","SDSSDDSSDS","SS..SS..SS","DD..DD..DD"]},
gem:{p:{C:'#7ff3ff',L:'#d9fdff',D:'#2bb6c9'},r:[".CCC.","CLCCC","CCCCD",".CCD.","..D.."]}
};
const HATS={none:{n:'Без шапки',r:["........","........"],c:'#000',cost:0},
 cap:{n:'Кепка',r:["..XXXXX.","XXXXXXXX"],c:'#e53935',cost:40},
 ears:{n:'Кошачьи ушки',r:["X......X","XX....XX"],c:'#ff8fc8',cost:60},
 helmet:{n:'Железный шлем',r:[".XXXXXX.","XXXXXXXX"],c:'#c9ced8',cost:100},
 crown:{n:'Корона',r:["X..XX..X","XXXXXXXX"],c:'#ffd23f',cost:200}};
const SHIRTS=[{c:'#2f8de4',n:'Синяя',cost:0},{c:'#e53935',n:'Красная',cost:30},{c:'#43a047',n:'Зелёная',cost:30},{c:'#8a5cd6',n:'Фиолетовая',cost:50},{c:'#ff9800',n:'Оранжевая',cost:50},{c:'#222631',n:'Чёрная',cost:80},{c:'#ffd23f',n:'Золотая',cost:150}];
function heroSpr(skin){const sk=skin||S.skin;const h=HATS[sk.hat]||HATS.none;return{p:{H:'#5a3a1e',S:'#f1c27d',W:'#ffffff',E:'#2b2b5a',M:'#b5523b',T:sk.shirt,P:'#2b4a8a',B:'#3a2a1a',X:h.c},
 r:[...h.r,"HHHHHHHH","HSSSSSSH","SWESSEWS","SSSSSSSS","SSSMMSSS","SSSSSSSS","TTTTTTTT","TTTTTTTT","STTTTTTS","PPPPPPPP","PPP..PPP","BBB..BBB"]}}
function draw(spr,scale){const rows=spr.r,h=rows.length,w=Math.max(...rows.map(x=>x.length));const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const g=c.getContext('2d');
 rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{const col=spr.p[ch];if(col){g.fillStyle=col;g.fillRect(x*scale,y*scale,scale,scale);g.fillStyle='rgba(0,0,0,.10)';g.fillRect(x*scale,(y+1)*scale-Math.max(1,scale/5),scale,Math.max(1,scale/5))}})});return c}
function fillSprites(root){(root||document).querySelectorAll('[data-spr]').forEach(el=>{const k=el.dataset.spr,sc=+el.dataset.sc||8;let spr;if(k==='hero'){spr=heroSpr(el.dataset.skin?JSON.parse(el.dataset.skin):null)}else spr=SPR[k];el.innerHTML='';el.appendChild(draw(spr,sc))})}

const key=(a,b)=>Math.min(a,b)+'x'+Math.max(a,b);
const score=(a,b)=>S.facts[key(a,b)]||0;
function record(a,b,ok){const k=key(a,b),s=S.facts[k]||0;S.facts[k]=ok?Math.min(5,s+1):Math.max(0,s-2);save()}
function pick(pool,last){let tot=0;const w=pool.map(p=>{let x=6-Math.min(5,score(p[0],p[1]));if(key(p[0],p[1])===last)x=.03;tot+=x;return x});let r=Math.random()*tot;let ch=pool[pool.length-1];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){ch=pool[i];break}}
 return Math.random()<.45?[ch[1],ch[0]]:[ch[0],ch[1]]}
function poolFor(lv){const p=[];if(lv.boss){for(let a=2;a<=9;a++)for(let b=a;b<=9;b++)p.push([a,b])}else{for(let n=1;n<=10;n++)p.push([lv.t,n])}return p}
function hint(a,b){const r=a*b,x=Math.max(a,b),y=Math.min(a,b),o=(t)=>a===t?b:a;let t;
 if(x===8&&y===7)t='Запомни считалку: <b>5, 6, 7, 8</b> → 56 = 7 × 8';
 else if(a===10||b===10)t=`×10 — просто допиши ноль: ${o(10)} → <b>${r}</b>`;
 else if(a===1||b===1)t=`×1 — число не меняется: <b>${r}</b>`;
 else if(a===9||b===9){const n=o(9);t=`Трюк для 9: 9×${n} = 10×${n} − ${n} = ${10*n} − ${n} = <b>${r}</b>`}
 else if(a===5||b===5){const n=o(5);t=`5×${n} — это половина от 10×${n} = ${10*n}. Половина = <b>${r}</b>`}
 else if(a===2||b===2){const n=o(2);t=`×2 — это удвоить: ${n} + ${n} = <b>${r}</b>`}
 else if(a===4||b===4){const n=o(4);t=`×4 — удвой два раза: ${n} → ${2*n} → <b>${r}</b>`}
 else if(a===8||b===8){const n=o(8);t=`×8 — удвой три раза: ${n} → ${2*n} → ${4*n} → <b>${r}</b>`}
 else if((a===6||b===6)&&o(6)%2===0){const n=o(6);t=`Секрет шестёрки: 6 × чётное число заканчивается на это же число! 6×${n} = <b>${r}</b>`}
 else if(a===b)t=`Квадрат: ${a}×${a} = <b>${r}</b>. Представь квадрат из блоков ${a} на ${a}!`;
 else t=`Разбей на части: ${x}×${y} = ${x}×${y-1} + ${x} = ${x*(y-1)} + ${x} = <b>${r}</b>`;
 if(a!==b)t+=`<br><small style="color:#c7cbe0">Помни: ${a}×${b} = ${b}×${a} — это один и тот же пример!</small>`;return t}

const SX=56,SZ=56,SY=28,GRAV=28,JUMPV=9.2,SPEED=4.8;
let G=null;
const B3={
 slime:{tree:'oak',leaf:'#3e9b35',log:'#6b4423',stone:'#7d7d85'},
 mushroom:{tree:'shroom',leaf:'#2f7d3a',log:'#5b3b1c',stone:'#6f6f78'},
 cactus:{tree:'cactus',leaf:'#3f9a3a',log:'#3f9a3a',stone:'#cfa862'},

 snake:{tree:'jungle',leaf:'#1f7a2e',log:'#5b3b1c',stone:'#5d6b55'},
 eye:{tree:'crystal',leaf:'#7ff3ff',log:'#444444',stone:'#4a4a55',dark:1,water:'#1a2a44'},
 lava:{tree:'none',leaf:'#ff8c1a',log:'#222222',stone:'#3a2420',lava:1,dark:1},
 dragon:{tree:'oak',leaf:'#4fbf4f',log:'#7a5230',stone:'#9aa3b5',sky:1},
 golem:{tree:'none',leaf:'#555555',log:'#333333',stone:'#3a3d46',lava:1,dark:1}};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function tex16(base,o={}){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d'),R=rng(o.seed||7);
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){let col=base;if(o.band&&(y<3||(y<5&&R()<.5)))col=o.band;if(o.dots&&R()<.08)col=o.dots;g.fillStyle=shade(col,Math.floor((R()-.5)*(o.v||34)));g.fillRect(x,y,1,1)}
 if(o.stripes){g.fillStyle='rgba(0,0,0,.18)';for(let x=1;x<16;x+=4)g.fillRect(x,0,1,16)}
 g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,15,16,1);g.fillRect(15,0,1,16);return c}
function nearest(t){t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t}
function atlasMat(side,top,bot,extra){const c=document.createElement('canvas');c.width=48;c.height=16;const g=c.getContext('2d');g.drawImage(side,0,0);g.drawImage(top||side,16,0);g.drawImage(bot||side,32,0);
 return new THREE.MeshLambertMaterial(Object.assign({map:nearest(new THREE.CanvasTexture(c))},extra||{}))}
function atlasGeo(){const g=new THREE.BoxGeometry(1,1,1),uv=g.attributes.uv;for(let f=0;f<6;f++){const tile=f===2?1:f===3?2:0;for(let v=0;v<4;v++){const i=f*4+v;uv.setX(i,(tile+uv.getX(i))/3)}}uv.needsUpdate=true;return g}
function vnoise(R,cells){const n=cells+1,g=[];for(let i=0;i<n*n;i++)g.push(R());const v=(a,b)=>g[Math.min(n-1,b)*n+Math.min(n-1,a)];
 return(x,z)=>{const fx=x/SX*cells,fz=z/SZ*cells,ix=Math.floor(fx),iz=Math.floor(fz),tx=fx-ix,tz=fz-iz,sx=tx*tx*(3-2*tx),sz=tz*tz*(3-2*tz);
  const a=v(ix,iz)+(v(ix+1,iz)-v(ix,iz))*sx,b=v(ix,iz+1)+(v(ix+1,iz+1)-v(ix,iz+1))*sx;return a+(b-a)*sz}}
const bid=(x,y,z)=>(x*SZ+z)*SY+y;

function genWorld(i){const lv=LEVELS[i],bm=B3[lv.mob],R=rng(5000+i*131),n1=vnoise(R,4),n2=vnoise(R,9);
 const W=new Uint8Array(SX*SY*SZ),H=new Int16Array(SX*SZ),blocked=new Uint8Array(SX*SZ),lavaC=new Uint8Array(SX*SZ);
 const spawn={x:6.5,z:SZ/2},portal={x:SX-7,z:Math.floor(SZ/2)};
 for(let x=0;x<SX;x++)for(let z=0;z<SZ;z++){let h=5+n1(x,z)*8+n2(x,z)*3;const ex=Math.min(x,z,SX-1-x,SZ-1-z);if(ex<5)h-=(5-ex)*1.3;
  const ds=Math.hypot(x+.5-spawn.x,z+.5-spawn.z),dp=Math.hypot(x+.5-portal.x,z+.5-portal.z);
  if(ds<6){const k=Math.max(0,(ds-4)/2);h=7*(1-k)+h*k}if(dp<7){const k=Math.max(0,(dp-5)/2);h=7*(1-k)+h*k}
  h=Math.max(4,Math.min(SY-12,Math.round(h)));H[x*SZ+z]=h;
  for(let y=0;y<h;y++)W[bid(x,y,z)]=y===h-1?1:y>=h-3?2:3;
  if(bm.lava&&h<6){for(let y=h;y<6;y++)W[bid(x,y,z)]=10;lavaC[x*SZ+z]=1;H[x*SZ+z]=6}}
 const put=(x,y,z,b)=>{if(x<0||z<0||x>=SX||z>=SZ||y<0||y>=SY)return;if(!W[bid(x,y,z)])W[bid(x,y,z)]=b};
 const far=(x,z,d)=>Math.hypot(x-spawn.x,z-spawn.z)>d&&Math.hypot(x-portal.x,z-portal.z)>d;
 // деревья
 const trees=[];
 if(bm.tree!=='none')for(let k=0;k<400&&trees.length<(bm.tree==='cactus'||bm.tree==='crystal'?30:24);k++){const x=3+Math.floor(R()*(SX-6)),z=3+Math.floor(R()*(SZ-6));
  if(!far(x,z,7)||lavaC[x*SZ+z]||trees.some(t=>Math.hypot(t[0]-x,t[1]-z)<4.5))continue;trees.push([x,z]);const h=H[x*SZ+z];blocked[x*SZ+z]=1;
  const T=bm.tree;
  if(T==='oak'||T==='jungle'){const th=T==='jungle'?6+Math.floor(R()*2):4+Math.floor(R()*2);for(let k2=0;k2<th;k2++)put(x,h+k2,z,4);
   const rad=T==='jungle'?2:2,layers=T==='jungle'?3:2;for(let ly=0;ly<layers;ly++)for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){if(Math.abs(dx)===rad&&Math.abs(dz)===rad&&R()<.6)continue;put(x+dx,h+th-layers+ly,z+dz,5)}
   for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)if(!(dx&&dz))put(x+dx,h+th,z+dz,5);
   for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++)blocked[(x+dx)*SZ+z+dz]=1}
  else if(T==='pine'){for(let k2=0;k2<5;k2++)put(x,h+k2,z,4);const L=[[2,2],[3,1],[4,2],[5,1],[6,0]];
   L.forEach(([dy,r])=>{for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++)if(Math.abs(dx)+Math.abs(dz)<=r+ (r>1?0:1))put(x+dx,h+dy,z+dz,5)});put(x,h+7,z,5)}
  else if(T==='shroom'){for(let k2=0;k2<4;k2++)put(x,h+k2,z,7);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(!(Math.abs(dx)===2&&Math.abs(dz)===2))put(x+dx,h+4,z+dz,6);

 <div class="legend"><span><i style="background:#3a3f55"></i>ещё не было</span><span><i style="background:#d84343"></i>ошибка</span><span><i style="background:#f08a24"></i>учу</span><span><i style="background:#c0ca33"></i>почти</span><span><i style="background:#43a047"></i>освоено</span></div>
 <div class="km">${h}</div><p class="note" style="margin-top:14px">💡 Секрет: 3×7 и 7×3 — одно и то же! Поэтому учить нужно не 100 примеров, а всего <b>55</b>.<br>Освоено: <b style="color:#7ed957">${masteredCount()} из 55</b></p></div>`;
 fillSprites();bindTop();document.getElementById('back').onclick=()=>{SFX.click();screenMap()}}

/* ----- МАГАЗИН ----- */
function screenShop(){stopGame();cur=null;const owned=x=>S.owned.includes(x);
 const shirts=SHIRTS.map(s=>{const id='shirt:'+s.c,on=S.skin.shirt===s.c;return`<div class="panel item ${on?'on':''}" data-id="${id}" data-cost="${s.cost}"><div class="pv"><div data-spr="hero" data-sc="7" data-skin='${JSON.stringify({shirt:s.c,hat:S.skin.hat})}'></div></div><div style="font-weight:900">${s.n}</div><div class="px" style="font-size:10px;margin-top:6px;color:${on?'#ffd23f':owned(id)?'#7ed957':'#7ff3ff'}">${on?'НАДЕТО':owned(id)?'НАДЕТЬ':'💎 '+s.cost}</div></div>`}).join('');
 const hats=Object.entries(HATS).map(([k,h])=>{const id='hat:'+k,on=S.skin.hat===k;return`<div class="panel item ${on?'on':''}" data-id="${id}" data-cost="${h.cost}"><div class="pv"><div data-spr="hero" data-sc="7" data-skin='${JSON.stringify({shirt:S.skin.shirt,hat:k})}'></div></div><div style="font-weight:900">${h.n}</div><div class="px" style="font-size:10px;margin-top:6px;color:${on?'#ffd23f':owned(id)?'#7ed957':'#7ff3ff'}">${on?'НАДЕТО':owned(id)?'НАДЕТЬ':'💎 '+h.cost}</div></div>`}).join('');
 app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">Магазин</h2></div>
 <p class="note">Зарабатывай кристаллы 💎 в битвах и в шахте — и наряжай своего героя!</p><h2 class="sec">Одежда</h2><div class="shop">${shirts}</div><h2 class="sec" style="margin-top:18px">Шапки</h2><div class="shop">${hats}</div>`;
 fillSprites();bindTop();document.getElementById('back').onclick=()=>{SFX.click();screenMap()};
 app.querySelectorAll('.item').forEach(e=>e.onclick=()=>{const id=e.dataset.id,cost=+e.dataset.cost,[type,val]=id.split(':');
  if(!S.owned.includes(id)){if(S.crystals<cost){SFX.bad();toast(`Не хватает кристаллов: нужно ещё ${cost-S.crystals} 💎`);return}S.crystals-=cost;S.owned.push(id);SFX.coin();toast('Куплено! 🎉')}else SFX.click();
  if(type==='shirt')S.skin.shirt=val;else S.skin.hat=val;save();screenShop()})}

/* ----- ДОСТИЖЕНИЯ ----- */
function screenAch(){stopGame();cur=null;app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">Достижения</h2></div>
 ${ACH.map(a=>`<div class="panel ach ${S.ach[a.id]?'':'no'}"><div class="ic">${a.ic}</div><div><b>${a.n}</b><small>${a.d}</small></div><div style="margin-left:auto;font-size:22px">${S.ach[a.id]?'✅':'🔒'}</div></div>`).join('')}
 <p class="note">Лучшее комбо: <b>${S.bestCombo}</b> · Побед: <b>${S.wins||0}</b> · Рекорд шахты: <b>${S.mineBest}</b></p>`;
 fillSprites();bindTop();document.getElementById('back').onclick=()=>{SFX.click();screenMap()}}


/* ----- СЕРТИФИКАТ ----- */
function drawCert(){const W=1200,H=850,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 g.fillStyle='#fdf6e3';g.fillRect(0,0,W,H);
 const bl=['#5aa83a','#8a5a2b','#7d7d85','#ffd23f','#2f8de4','#e53935','#8a5cd6'];for(let x=0;x<W;x+=30)for(const y of[0,H-30]){g.fillStyle=bl[(x/30+y)%bl.length|0];g.fillRect(x,y,30,30);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x,y+24,30,6)}
 for(let y=30;y<H-30;y+=30)for(const x of[0,W-30]){g.fillStyle=bl[(y/30+x)%bl.length|0];g.fillRect(x,y,30,30);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x,y+24,30,6)}
 g.strokeStyle='#c9a227';g.lineWidth=6;g.strokeRect(54,54,W-108,H-108);
 g.textAlign='center';g.fillStyle='#2b3044';g.font='46px "Press Start 2P"';g.fillText('СЕРТИФИКАТ',W/2,150);
 g.fillStyle='#c9a227';g.font='22px "Press Start 2P"';g.fillText('МАСТЕР УМНОЖЕНИЯ',W/2,205);
 g.fillStyle='#555';g.font='24px Rubik, sans-serif';g.fillText('Настоящим подтверждается, что',W/2,270);
 g.fillStyle='#1f6fbf';g.font='bold 64px Rubik, sans-serif';g.fillText(S.name,W/2,350);g.fillStyle='#c9a227';g.fillRect(W/2-260,368,520,4);
 g.fillStyle='#333';g.font='26px Rubik, sans-serif';g.fillText('прошёл все острова Блокограда, победил Тёмного Голема',W/2,425);g.fillText('и доказал знание таблицы умножения!',W/2,462);
 const stars=Object.values(S.stars).reduce((a,b)=>a+b,0);const st=[[masteredCount()+' из 55','освоено примеров'],[stars+' из 27','звёзд собрано'],[S.bestCombo,'лучшее комбо']];
 st.forEach(([v,l],k)=>{const x=W/2+(k-1)*300;g.fillStyle='#2b3044';g.fillRect(x-120,505,240,110);g.fillStyle='#ffd23f';g.font='26px "Press Start 2P"';g.fillText(String(v),x,560);g.fillStyle='#fff';g.font='18px Rubik, sans-serif';g.fillText(l,x,595)});
 const hero=draw(heroSpr(),9);g.imageSmoothingEnabled=false;g.drawImage(hero,W/2-190,630);const gol=draw(SPR.golem,8);g.drawImage(gol,W/2+110,668);
 g.fillStyle='#e53935';g.beginPath();g.arc(W/2,705,48,0,7);g.fill();g.fillStyle='#ffd23f';g.font='34px "Press Start 2P"';g.fillText('★',W/2,720);
 const d=new Date(),dd=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
 g.fillStyle='#555';g.font='20px Rubik, sans-serif';g.textAlign='left';g.fillText('Дата: '+(S.certDate||dd),110,770);g.textAlign='right';g.fillText('Блокоград · shav5544-cmd.github.io/blokograd',W-110,770);
 return c}
async function screenCert(){stopGame();cur=null;if(!S.certDate){const d=new Date();S.certDate=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();save()}
 try{await document.fonts.load('46px "Press Start 2P"');await document.fonts.load('bold 64px Rubik')}catch(e){}
 const c=drawCert(),url=c.toDataURL('image/png');SFX.win();
 app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">Твой сертификат</h2></div>
 <img src="${url}" alt="Сертификат" style="width:100%;border:4px solid #11131b;display:block">
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><a class="btn gold" id="dl" href="${url}" download="Сертификат_${esc(S.name)}.png" style="text-decoration:none">⬇ Скачать картинку</a></div>
 <p class="note">На телефоне или планшете можно также нажать на картинку и удерживать → «Сохранить изображение».</p>`;
 bindTop();document.getElementById('back').onclick=()=>{SFX.click();screenMap()}}

/* ----- СОХРАНЕНИЕ ----- */
function screenSave(){stopGame();cur=null;const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">Сохранение</h2></div>
 <div class="panel"><p style="font-size:16px;line-height:1.45;margin-top:0">Прогресс хранится только в этом браузере. Чтобы продолжить игру на другом устройстве (или перейти со старого файла на сайт):<br>1) здесь нажми <b>«Скопировать код»</b>;<br>2) отправь код себе (например, в Telegram);<br>3) на другом устройстве открой «Сохранение» и вставь код в нижнее поле.</p>
 <textarea id="code" readonly style="width:100%;height:90px;font-size:12px;background:#151824;color:#7ff3ff;border:3px solid #11131b">${code}</textarea>
 <button class="btn" id="cp" style="margin-top:8px">📋 Скопировать код</button></div>
 <div class="panel" style="margin-top:12px"><b style="font-size:17px">Загрузить прогресс с другого устройства</b>
 <textarea id="inp" placeholder="Вставь код сюда" style="width:100%;height:90px;font-size:12px;margin-top:8px;background:#151824;color:#fff;border:3px solid #11131b"></textarea>
 <button class="btn orange" id="ld" style="margin-top:8px">📥 Загрузить</button></div>`;
 bindTop();document.getElementById('back').onclick=()=>{SFX.click();screenMap()};
 document.getElementById('cp').onclick=async()=>{const t=document.getElementById('code');try{await navigator.clipboard.writeText(t.value);toast('Код скопирован! 📋')}catch(e){t.select();try{document.execCommand('copy');toast('Код скопирован! 📋')}catch(_){toast('Выдели код и скопируй вручную')}}};
 document.getElementById('ld').onclick=()=>{const v=document.getElementById('inp').value.trim();if(!v){toast('Сначала вставь код');return}
  try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(typeof o!=='object'||!('crystals' in o))throw 0;
   modal(`<h2>Загрузить прогресс?</h2><p>Герой: <b>${esc(o.name||'?')}</b><br>Кристаллы: ${o.crystals} · Открыто островов: ${o.unlocked}</p><p style="color:#ffb547">Текущий прогресс на этом устройстве будет заменён.</p>`,
   [{t:'Да, загрузить',f:()=>{S=Object.assign(defaults(),o);save();SFX.win();toast('Прогресс загружен! 🎉');screenMap()}},{t:'Отмена',cls:'grey'}])}catch(e){SFX.bad();toast('Код не подходит. Проверь, что скопирован целиком.')}}}

/* ===================== СТАРТ ===================== */
if(!S.name)screenName();else{checkDaily();screenMap()}
</script>
</body>
</html>
