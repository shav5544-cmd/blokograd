 const hero=draw(heroSpr(),9);g.imageSmoothingEnabled=false;g.drawImage(hero,W/2-190,630);const gol=draw(SPR.golem,8);g.drawImage(gol,W/2+110,668);
 g.fillStyle='#e53935';g.beginPath();g.arc(W/2,705,48,0,7);g.fill();g.fillStyle='#ffd23f';g.font='34px "Press Start 2P"';g.fillText('★',W/2,720);
 const d=new Date(),dd=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
 g.fillStyle='#555';g.font='20px Rubik, sans-serif';g.textAlign='left';g.fillText('Дата: '+(S.certDate||dd),110,770);g.textAlign='right';g.fillText('Блокоград · shav5544-cmd.github.io/blokograd',W-110,770);
 return c}

function screenSave(){stopGame();cur=null;const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">Сохранение</h2></div>
 <div class="panel"><p style="font-size:16px;line-height:1.45;margin-top:0">Прогресс хранится только в этом браузере. Чтобы продолжить игру на другом устройстве (или перейти со старого файла на сайт):<br>1) здесь нажми <b>«Скопировать код»</b>;<br>2) отправь код себе (например, в Telegram);<br>3) на другом устройстве открой «Сохранение» и вставь код в нижнее поле.</p>

   modal(`<h2>Загрузить прогресс?</h2><p>Герой: <b>${esc(o.name||'?')}</b><br>Кристаллы: ${o.crystals} · Открыто островов: ${o.unlocked}</p><p style="color:#ffb547">Текущий прогресс на этом устройстве будет заменён.</p>`,
   [{t:'Да, загрузить',f:()=>{S=Object.assign(defaults(),o);save();SFX.win();toast('Прогресс загружен! 🎉');screenMap()}},{t:'Отмена',cls:'grey'}])}catch(e){SFX.bad();toast('Код не подходит. Проверь, что скопирован целиком.')}}}


/* ===================== ИГРА ВДВОЁМ ===================== */
let NET=null;
function netSend(o){if(NET&&NET.open&&NET.conn){try{NET.conn.send(o)}catch(e){}}}
function netClose(){if(NET){try{NET.mic&&NET.mic.getTracks().forEach(t=>t.stop())}catch(e){}try{NET.audio&&(NET.audio.srcObject=null)}catch(e){}try{NET.conn&&NET.conn.close()}catch(e){}try{NET.peer&&NET.peer.destroy()}catch(e){}}NET=null}
function nameTag(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,8,256,48);g.fillStyle='#ffd23f';g.font='bold 34px Rubik, sans-serif';g.textAlign='center';g.fillText(t,128,44);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(1.2,.3,1);sp.position.y=2.15;return sp}
function netTick(dt){if(!G||!G.mp)return;G.netT-=dt;G.mobT-=dt;const p=G.p;
 if(G.netT<=0){G.netT=.09;netSend({t:'pos',x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),f:+p.face.toFixed(2),mv:Math.hypot(p.vx,p.vz)>.1?1:0,sw:p.swing>0?1:0,g:p.onGround?1:0})}
 if(NET.host&&G.mobT<=0){G.mobT=.15;netSend({t:'mobs',a:G.mobs.map(m=>[+m.x.toFixed(2),+m.z.toFixed(2),+(m.face||0).toFixed(2)])})}}
function friendTick(dt){if(!G||!G.mp||!G.friend)return;const F=G.friend,f=G.fr,g=F.grp.position,k=Math.min(1,dt*10);
 g.x+=(f.x-g.x)*k;g.y+=(f.y-g.y)*k;g.z+=(f.z-g.z)*k;F.grp.rotation.y=lerpA(F.grp.rotation.y,f.face,k);
 if(f.mv)F.phase+=dt*10;else F.phase*=.85;const sw=Math.sin(F.phase)*.75;F.legL.rotation.x=sw;F.legR.rotation.x=-sw;F.armL.rotation.x=-sw*.8;
 F.armR.rotation.x=f.sw?-1.6:sw*.8;F.sword.visible=!!f.sw;F.air=(F.air||0)+((f.g===0?1:0)-(F.air||0))*Math.min(1,dt*12);armsUp(F,F.air,f.sw)}
function onNet(d){if(!d||!d.t)return;
 if(d.t==='hello'){NET.fName=String(d.name||'Друг').slice(0,14);NET.fSkin=d.skin||{shirt:'#e53935',hat:'none'};NET.fSword=d.sword||'iron';NET.fPet=SPR[d.pet]?d.pet:null;
  if(!NET.host&&(NET.fSkin.char||'max')===(S.skin.char||'max')){const free=CHARS.find(c=>c.k!==(NET.fSkin.char||'max'));S.skin.char=free.k;save();toast('🧍 '+esc(NET.fName)+' уже играет за этого героя — ты теперь '+free.n);netSend({t:'hello',name:S.name,skin:S.skin,sword:S.sword||'iron',pet:S.pet||null})}
  if(G&&G.mp&&G.friend){const pos=G.friend.grp.position.clone();G.scene.remove(G.friend.grp);G.friend=buildHero(NET.fSkin,NET.fSword);G.friend.grp.position.copy(pos);G.friend.grp.add(nameTag(NET.fName));G.friend.phase=0;G.scene.add(G.friend.grp);if(G.fpet){G.scene.remove(G.fpet);G.fpet=null}if(NET.fPet){G.fpet=voxelMob(NET.fPet,.55);G.fpet.position.copy(pos);G.scene.add(G.fpet)}}
  if(NET.onHello){const f=NET.onHello;NET.onHello=null;f()}return}
 if(d.t==='mic'){NET.fMic=!!d.on;toast(d.on?'🎤 '+esc(NET.fName)+' включил микрофон':'🔇 '+esc(NET.fName)+' выключил микрофон');return}
 if(d.t==='start'){toast('👥 '+esc(NET.fName)+' выбрал остров «'+LEVELS[d.i].name+'»');startLevel(d.i,true);return}
 if(d.t==='bye'){toast('👋 '+esc(NET.fName||'Друг')+' вышел из игры');return}
 if(!G||!G.mp)return;
 if(d.t==='pos'){Object.assign(G.fr,{x:d.x,y:d.y,z:d.z,face:d.f,mv:d.mv,sw:d.sw,g:d.g});return}
 if(d.t==='mobs'&&!NET.host){d.a.forEach((v,i)=>{const m=G.mobs[i];if(m){m.nx=v[0];m.nz=v[1];m.nf=v[2]}});return}
 if(d.t==='gem'){const g=G.gems[d.i];if(g&&!g.got){g.got=true;G.scene.remove(g.m)}return}
 if(d.t==='chest'){const c=G.chests[d.i];if(c&&!c.open){c.open=true;c.lock.visible=false;burst(c.x,c.y+.6,c.z,'#ffd23f',10)}if(G.target===c)cancelFight('Друг уже открыл этот сундук!');return}
 if(d.t==='hit'){const m=G.mobs[d.i];if(m&&m.alive){m.hp=Math.min(m.hp,d.hp);m.flash=.4}return}
 if(d.t==='kill'){const m=G.mobs[d.i];if(!m||!m.alive)return;m.alive=false;G.scene.remove(m.grp);burst(m.x,m.y+.5*m.size,m.z,m.grp.userData.main,24,6);
  if(m.guard){G.portalOpen=true;drawPortal();SFX.win();gMsg('Друг победил стража! Портал открыт!')}
  else{G.killed++;gMsg('⚔ '+NET.fName+' победил моба! '+G.killed+'/'+G.total);if(G.killed>=G.total){const gd=G.mobs.find(x=>x.guard&&x.alive);if(gd&&gd.shield){gd.grp.remove(gd.shield);burst(gd.x,gd.y+gd.size,gd.z,'#5ad1ff',30,6)}setTimeout(()=>{if(G){SFX.win();gMsg('🛡 Щит стража исчез! Победите его!')}},700)}}
  if(G.target===m)cancelFight('Друг уже победил этого моба!');return}
 if(d.t==='win'){gWin(true)}}
function onCall(call){if(!NET)return;try{NET.inCall&&NET.inCall.close()}catch(e){}NET.inCall=call;call.answer();call.on('stream',rs=>{let a=NET.audio;if(!a){a=new Audio();a.autoplay=true;NET.audio=a}a.srcObject=rs;
 a.play().then(()=>{}).catch(()=>{const b=document.createElement('button');b.className='btn toast';b.textContent='🔈 Нажми, чтобы слышать '+NET.fName;b.onclick=()=>{a.play().catch(()=>{});b.remove()};document.body.appendChild(b);setTimeout(()=>b.remove(),15000)})})}
function lmicBind(){const b=document.getElementById('lmic');if(!b)return;const upd=()=>{b.textContent=NET&&NET.mic?'🎤 Микрофон включён (нажми, чтобы выключить)':'🎤 Включить микрофон';b.style.background=NET&&NET.mic?'#43a047':'#6b7085'};upd();b.onclick=()=>{voiceToggle();setTimeout(upd,1500)}}
function micBtn(){const b=document.getElementById('micb');if(b){b.textContent=NET&&NET.mic?'🎤 Вкл':'🎤 Выкл';b.style.background=NET&&NET.mic?'#43a047cc':'#6b7085cc'}}
function voiceToggle(){if(!NET||!NET.open)return;if(NET.mic){NET.mic.getTracks().forEach(t=>t.stop());try{NET.outCall&&NET.outCall.close()}catch(e){}NET.mic=null;NET.outCall=null;netSend({t:'mic',on:0});micBtn();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Этот браузер не поддерживает микрофон');return}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(st=>{if(!NET||!NET.open){st.getTracks().forEach(t=>t.stop());return}NET.mic=st;NET.outCall=NET.peer.call(NET.remoteId,st);netSend({t:'mic',on:1});micBtn();toast('🎤 Микрофон включён — друг тебя слышит')})
 .catch(()=>toast('Нет доступа к микрофону. Разреши его в настройках браузера.'))}
function cancelFight(msg){const h=document.querySelector('#quiz .hint');if(h)h.remove();modalBtn=null;endFight();gMsg(msg)}
function netBind(conn){NET.conn=conn;NET.remoteId=conn.peer;conn.on('open',()=>{NET.open=true;conn.send({t:'hello',name:S.name,skin:S.skin,sword:S.sword||'iron',pet:S.pet||null})});
 conn.on('data',onNet);conn.on('close',()=>{const was=NET&&NET.open;if(NET)NET.open=false;if(G)G.mp=false;if(G&&G.friend){G.scene.remove(G.friend.grp);G.friend=null;G.fr=null}if(G&&G.fpet){G.scene.remove(G.fpet);G.fpet=null}if(was){toast('🔌 Связь с другом потеряна');if(!G)screenMap()}});
 conn.on('error',()=>{})}
function mpCode(){return String(Math.floor(100000+Math.random()*900000))}
function screenMP(){stopGame();cur=null;
 if(typeof Peer==='undefined'){modal('<h2>Нет связи</h2><p>Для игры вдвоём нужен интернет. Проверь подключение и обнови страницу.</p>',[{t:'На карту',f:screenMap}]);return}
 app.innerHTML=topbar()+`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn grey" id="back">← Карта</button><h2 class="sec" style="margin:0">👥 Играть вдвоём</h2></div>
 <div id="mpbox"><div class="panel"><p style="font-size:17px;line-height:1.45;margin-top:0">Играйте с другом на одном острове! Каждый решает свои примеры, а мобов, сундуки и стража вы побеждаете вместе.</p>
 <p style="font-size:16px;margin:8px 0 6px"><b>Выбери своего героя:</b> <small style="color:#c7cbe0">у друга должен быть другой</small></p>
 <div class="shop" id="chp">${CHARS.map(c=>`<div class="panel item ${(S.skin.char||'max')===c.k?'on':''}" data-ch="${c.k}"><div class="pv" style="height:110px"><div data-spr="hero" data-sc="6" data-skin='${JSON.stringify({shirt:S.skin.shirt,hat:S.skin.hat,char:c.k})}'></div></div><b>${c.n}</b></div>`).join('')}</div>
 <div class="menu" style="margin-top:12px"><button class="btn" id="host" style="background:#e0539a">🏠 Создать игру<span class="sub">получить код для друга</span></button>
 <button class="btn blue" id="join">🔗 Присоединиться<span class="sub">ввести код друга</span></button></div></div></div>`;
 fillSprites();bindTop();document.getElementById('back').onclick=()=>{SFX.click();netClose();screenMap()};
 document.querySelectorAll('#chp [data-ch]').forEach(e=>e.onclick=()=>{SFX.click();S.skin.char=e.dataset.ch;save();document.querySelectorAll('#chp [data-ch]').forEach(x=>x.classList.toggle('on',x===e))});
 document.getElementById('host').onclick=()=>{SFX.click();mpHost()};document.getElementById('join').onclick=()=>{SFX.click();mpJoinForm()}}
function mpBox(h){const b=document.getElementById('mpbox');if(b)b.innerHTML=`<div class="panel" style="text-align:center">${h}</div>`}
function mpHost(tries){netClose();const code=mpCode();NET={host:true,code,open:false};mpBox('<p style="font-size:17px">Создаю игру…</p>');
 const peer=new Peer('blokograd-'+code,{debug:0});NET.peer=peer;peer.on('call',onCall);
 peer.on('open',()=>{mpBox(`<p style="font-size:17px;margin:0">Скажи другу этот код:</p><div class="px" style="font-size:40px;color:#ffd23f;margin:18px 0;letter-spacing:6px">${code}</div><p class="note">Друг открывает «Играть вдвоём» → «Присоединиться» и вводит код.<br>Ждём друга… ⏳</p>`)});
 peer.on('connection',conn=>{if(NET.conn&&NET.open){conn.close();return}netBind(conn);NET.onHello=()=>{SFX.win();mpPick()}});
 peer.on('error',e=>{if(e.type==='unavailable-id'&&(tries||0)<3)return mpHost((tries||0)+1);mpBox(`<p style="font-size:17px">Не получилось создать игру 😕</p><p class="note">Проверь интернет и попробуй ещё раз.</p><button class="btn" onclick="screenMP()">Ещё раз</button>`)})}
function mpPick(){if(!document.getElementById('mpbox'))screenMP();const opts=LEVELS.map((l,i)=>i<S.unlocked?`<button class="btn ${l.boss?'red':'blue'}" data-i="${i}">${l.name}<span class="sub">${l.boss?'все таблицы':'× '+l.t}</span></button>`:'').join('');
 mpBox(`<p style="font-size:18px;margin-top:0">✅ <b>${esc(NET.fName)}</b> подключился!</p><button class="btn green" id="lmic" style="background:#43a047;margin:4px 0 12px">🎤 Включить микрофон</button><p>Выбери остров, на котором будете играть:</p><div class="menu">${opts}</div>`);
 document.querySelectorAll('#mpbox [data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;startLevel(i)});lmicBind()}
function mpJoinForm(){mpBox(`<p style="font-size:17px;margin-top:0">Введи код, который сказал тебе друг:</p><input class="name" id="jc" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off"><div style="height:12px"></div><button class="btn" id="jgo" style="width:100%">Подключиться ▶</button>`);
 const jc=document.getElementById('jc');jc.focus();const go=()=>{const c=jc.value.replace(/\D/g,'');if(c.length!==6){toast('Код — это 6 цифр');return}mpJoin(c)};document.getElementById('jgo').onclick=go;jc.onkeydown=e=>{if(e.key==='Enter')go()}}
function mpJoin(code){netClose();NET={host:false,code,open:false};mpBox('<p style="font-size:17px">Подключаюсь… ⏳</p>');const peer=new Peer(undefined,{debug:0});NET.peer=peer;peer.on('call',onCall);
 const fail=()=>mpBox(`<p style="font-size:17px">Не удалось подключиться 😕</p><p class="note">Проверь код и что друг ещё ждёт на экране с кодом.</p><button class="btn" id="again">Ввести код снова</button>`)||null;
 const t=setTimeout(()=>{if(NET&&!NET.open){fail();const a=document.getElementById('again');if(a)a.onclick=mpJoinForm}},15000);
 peer.on('open',()=>{const conn=peer.connect('blokograd-'+code,{reliable:true});netBind(conn);NET.onHello=()=>{clearTimeout(t);SFX.win();mpBox(`<p style="font-size:18px;margin-top:0">✅ Ты в игре у <b>${esc(NET.fName)}</b>!</p><button class="btn" id="lmic" style="background:#43a047;margin:4px 0 12px">🎤 Включить микрофон</button><p class="note">Ждём, пока друг выберет остров… ⏳</p>`);lmicBind()}});
 peer.on('error',e=>{clearTimeout(t);fail();const a=document.getElementById('again');if(a)a.onclick=mpJoinForm})}

/* ===================== СТАРТ ===================== */
if(!S.name)screenName();else{checkDaily();screenMap()}
